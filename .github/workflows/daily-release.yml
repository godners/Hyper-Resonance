name: "[WORKFLOW] Daily Release"
# .github/workflows/daily-release.yml

on:
  schedule:
    - cron: '00 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-release:
    runs-on: self-hosted
    steps:
      - name: "[ACTION] Auto Release"
        uses: Godners-Code/auto-release-action@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
